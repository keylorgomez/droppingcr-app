    <!-- Splash: vive aquí y no en React para que el logo empiece a armarse en el
         primer milisegundo, mientras baja el JavaScript. La app lo quita con
         window.__dismissSplash() al montar. Solo en la primera visita de la sesión. -->
    <style>
      html, body { background: #faf9f7; }
      #splash { position: fixed; inset: 0; z-index: 9999; background: #000; color: #faf9f7;
                display: flex; flex-direction: column; align-items: center; justify-content: center;
                transition: opacity .5s cubic-bezier(.16,1,.3,1); }
      #splash .sp-logo { width: min(62vw, 380px); height: auto; overflow: visible;
                         transition: transform .6s cubic-bezier(.16,1,.3,1); }
      /* La gota cae (acelera como algo que cae de verdad), se aplasta al
         tocar y su salpicadura se abre hasta ser el óvalo del logo. Todo con
         transform-origin 0 0 dentro de un grupo trasladado al centro: es la
         forma que se comporta igual en Safari y en Chrome. */
      .sp-drop { transform-origin: 0 0; opacity: 0;
                 animation: sp-fall .62s cubic-bezier(.55,0,1,.45) .1s forwards,
                            sp-splat .22s ease-out .72s forwards; }
      .sp-ring { transform-origin: 0 0; transform: scale(.03); opacity: 0;
                 animation: sp-ripple .9s cubic-bezier(.16,1,.3,1) .76s forwards; }
      .sp-wave { transform-origin: 0 0; transform: scale(.03); opacity: 0;
                 animation: sp-wave 1s cubic-bezier(.16,1,.3,1) .78s forwards; }
      .sp-wave-2 { animation-duration: 1.3s; animation-delay: .86s; }
      .sp-l    { opacity: 0; transform: translateY(260px);
                 animation: sp-rise .65s cubic-bezier(.16,1,.3,1) forwards; }
      .sp-cr   { opacity: 0; transform: translateY(40px);
                 animation: sp-rise .5s cubic-bezier(.16,1,.3,1) 1.6s forwards; }
      .sp-bar  { width: min(62vw, 380px); height: 1px; margin-top: 32px; overflow: hidden;
                 background: rgba(250,249,247,.15); opacity: 0; animation: sp-fade .4s 1.8s forwards; }
      .sp-bar::after { content: ""; display: block; height: 100%; background: #faf9f7;
                       animation: sp-load 1.1s ease-in-out infinite; }
      #splash.sp-out { opacity: 0; pointer-events: none; }
      #splash.sp-out .sp-logo { transform: scale(.94); }
      @keyframes sp-fall   { 0% { opacity: 1; transform: translateY(-760px) scale(.85, 1.25); }
                             100% { opacity: 1; transform: translateY(0) scale(1, 1.1); } }
      @keyframes sp-splat  { 0% { opacity: 1; transform: scale(1.35, .55); }
                             100% { opacity: 0; transform: scale(2.4, .1); } }
      @keyframes sp-ripple { 0% { opacity: 1; transform: scale(.03); } 100% { opacity: 1; transform: scale(1); } }
      @keyframes sp-wave   { 0% { opacity: .9; transform: scale(.03); } 100% { opacity: 0; transform: scale(1.18); } }
      @keyframes sp-rise { to { opacity: 1; transform: none; } }
      @keyframes sp-fade { to { opacity: 1; } }
      @keyframes sp-load { from { transform: translateX(-100%); } to { transform: translateX(100%); } }
      @media (prefers-reduced-motion: reduce) {
        .sp-drop, .sp-wave { display: none; }
        .sp-ring { animation: none; opacity: 1; transform: none; }
        .sp-l, .sp-cr { animation: none; opacity: 1; transform: none; }
        .sp-bar { animation: none; opacity: 1; }
      }
    </style>

    <script>
      (function () {
        var splash = document.getElementById("splash");
        var seen = false;
        try { seen = sessionStorage.getItem("dcr-splash") === "1"; } catch (e) {}
        if (seen) { splash.remove(); window.__dismissSplash = function () {}; return; }
        try { sessionStorage.setItem("dcr-splash", "1"); } catch (e) {}

        var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        // Lo justo para ver el logo armado; nunca retrasa más que eso.
        var MIN = reduce ? 300 : 1700;
        var start = performance.now();
        var done = false;
        window.__dismissSplash = function () {
          if (done) return;
          done = true;
          setTimeout(function () {
            splash.classList.add("sp-out");
            setTimeout(function () { splash.remove(); }, 550);
          }, Math.max(0, MIN - (performance.now() - start)));
        };
        // Red de seguridad: si el JS falla, no dejar a nadie frente a una pantalla negra.
        setTimeout(window.__dismissSplash, 10000);
      })();
    </script>
